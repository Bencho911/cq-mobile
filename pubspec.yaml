name: cafe_quindio
description: "Café Quindío: pide antes de llegar, recoge sin fila y llena tu álbum de aves."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  lucide_icons_flutter: ^4.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/products/
    - assets/sfx/

  # Neutra Text es la fuente corporativa (House Industries, comercial):
  # confirmar que la licencia cubre uso en apps antes de publicar.
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Neutra Text
      fonts:
        - asset: assets/fonts/NeutraText-Book.ttf
          weight: 400
        - asset: assets/fonts/NeutraText-Demi.ttf
          weight: 600
        - asset: assets/fonts/NeutraText-Bold.ttf
          weight: 700
    - family: Neutra Text TF
      fonts:
        - asset: assets/fonts/NeutraTextTF-Demi.ttf
          weight: 600
